name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.21.0
  PHP_VERSION: "8.5"
  RUNTIME_IMAGE: personal-finance:ci
  BACKUP_IMAGE: personal-finance-backup:ci

jobs:
  pins:
    name: Version pins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/check-pins.sh

  backend:
    name: Backend (Pint, PHPStan, Pest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: finance_test
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          TZ: Europe/Madrid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: finance
      DB_PASSWORD: finance
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, intl, zip, bcmath, pcntl
          coverage: none
          tools: composer:2.10.3
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate --ansi
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - run: php artisan test --parallel

  frontend:
    name: Frontend (ESLint, Prettier, Vitest, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm test
      - run: npm run build
      - name: Service worker caches no API URL
        run: |
          jq -e '(.dataGroups // []) | length == 0' dist/frontend/browser/ngsw.json
          jq -e '[.assetGroups[].urls[] | select(test("^/(api|sanctum|up)(/|$)"))] | length == 0' dist/frontend/browser/ngsw.json
      - name: Web manifest is valid
        run: jq -e '.name and .short_name and .start_url and .display and (.icons | length > 0)' dist/frontend/browser/manifest.webmanifest

  image:
    name: Runtime and backup images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: runtime
          load: true
          push: false
          tags: ${{ env.RUNTIME_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7.4.0
        with:
          context: docker/backup
          load: true
          push: false
          tags: ${{ env.BACKUP_IMAGE }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max
      - name: No secrets in image layers, history or env
        run: scripts/check-image-secrets.sh "$RUNTIME_IMAGE" "$BACKUP_IMAGE"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    needs: image
    env:
      COMPOSE_FILE: compose.yaml:compose.prod.yaml
      E2E_BASE_URL: https://localhost
      E2E_USER_EMAIL: e2e@example.com
      E2E_USER_PASSWORD: e2e-password-123
      E2E_EXPECT_SECURITY_HEADERS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: runtime
          load: true
          push: false
          tags: ${{ env.RUNTIME_IMAGE }}
          cache-from: type=gha
      - uses: docker/build-push-action@v7.4.0
        with:
          context: docker/backup
          load: true
          push: false
          tags: ${{ env.BACKUP_IMAGE }}
          cache-from: type=gha,scope=backup
      - name: Write the compose environment
        run: |
          identity="$(docker run --rm --entrypoint age-keygen "$BACKUP_IMAGE" 2>/dev/null)"
          (umask 077; printf '%s\n' "$identity" > "${RUNNER_TEMP}/backup-identity.txt")
          {
            echo "APP_IMAGE=${RUNTIME_IMAGE}"
            echo "BACKUP_IMAGE=${BACKUP_IMAGE}"
            echo "BACKUP_AGE_RECIPIENT=$(docker run --rm -i --entrypoint age-keygen "$BACKUP_IMAGE" -y <<< "$identity")"
            echo "BACKUP_REMOTE=/backups/offsite"
            echo "APP_KEY=base64:$(openssl rand -base64 32)"
            echo "APP_URL=${E2E_BASE_URL}"
            echo "SERVER_NAME=localhost"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "SANCTUM_STATEFUL_DOMAINS=localhost"
            echo "API_RATE_LIMIT_PER_MINUTE=100000"
          } > .env
      - run: docker compose config --quiet
      - run: scripts/check-compose-env.sh
      - run: docker compose up -d --wait --wait-timeout 180
      - name: Runtime smoke (health, php.ini limits, receipts volume, schedule:list)
        run: scripts/smoke.sh
      - name: HTTPS redirect, HSTS and security headers
        run: |
          headers="$(curl -skI "${E2E_BASE_URL}/login")"
          printf '%s\n' "$headers"
          for header in 'strict-transport-security: max-age=31536000; includeSubDomains' \
            "content-security-policy: default-src 'self'" \
            'x-content-type-options: nosniff' \
            'referrer-policy: same-origin' \
            'permissions-policy: camera=(self), microphone=(self)' \
            'x-frame-options: DENY'; do
            grep -qiF "$header" <<< "$headers" || { echo "::error::missing header: ${header}"; exit 1; }
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/login)" = 308
      - name: The database publishes no port
        run: test -z "$(docker compose port db 5432 2>/dev/null)"
      - name: Backup produces encrypted archives, prunes expired copies and stays healthy
        run: |
          expired='pf-19990101T000000-db.dump.age'
          docker compose exec -T backup sh -c "
            set -eu
            mkdir -p /backups/offsite
            stale=\"\$(date -d @\$(( \$(date +%s) - 31 * 86400 )) '+%Y-%m-%d %H:%M:%S')\"
            for file in /backups/${expired} /backups/offsite/${expired}; do
              echo expired > \"\$file\"
              touch -d \"\$stale\" \"\$file\"
            done
          "
          docker compose exec -T backup backup-run
          docker compose exec -T backup sh -c 'ls /backups/offsite/*-db.dump.age /backups/offsite/*-storage.tar.gz.age /backups/offsite/*-manifest.txt.age'
          for file in "/backups/${expired}" "/backups/offsite/${expired}"; do
            if docker compose exec -T backup test -e "$file"; then echo "::error::expired backup not pruned: ${file}"; exit 1; fi
          done
          dump="$(docker compose exec -T backup sh -c 'ls -t /backups/offsite/*-db.dump.age | head -n 1' | tr -d '\r')"
          docker compose exec -T backup head -c 21 "$dump" | grep -q '^age-encryption.org/v1'
          if docker compose exec -T backup pg_restore -l "$dump" >/dev/null 2>&1; then echo "::error::the dump is readable without the private key"; exit 1; fi
          if docker compose exec -T backup age -d "$dump" >/dev/null 2>&1; then echo "::error::the dump decrypts without an identity"; exit 1; fi
          docker compose exec -T backup sh -c 'cat > /tmp/identity.txt && trap "rm -f /tmp/identity.txt" EXIT && age -d -i /tmp/identity.txt "$1" | pg_restore -l >/dev/null' sh "$dump" < "${RUNNER_TEMP}/backup-identity.txt"
          docker compose exec -T backup backup-healthcheck
          docker compose exec -T backup sh -c 'echo $(( $(date +%s) - (BACKUP_STALE_AFTER_HOURS + 1) * 3600 )) > /backups/.last-success'
          if docker compose exec -T backup backup-healthcheck; then echo "::error::the healthcheck stays healthy with a stale heartbeat"; exit 1; fi
          docker compose exec -T backup backup-run
          docker compose exec -T backup backup-healthcheck
      - name: Create the e2e user
        run: printf '%s' "${E2E_USER_PASSWORD}" | docker compose exec -T web php artisan app:create-user "${E2E_USER_EMAIL}" --name=E2E --password-stdin
      - name: Seed the dev ledger
        run: docker compose exec -T web php artisan db:seed --class='Database\Seeders\DevSeeder' --force --no-interaction
      - name: Ledger invariants hold on the dev seed
        run: docker compose exec -T web php artisan app:ledger:verify
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npx playwright install --with-deps chromium webkit
      - working-directory: frontend
        run: npx playwright test
      - name: Ledger invariants hold after the journeys
        run: docker compose exec -T web php artisan app:ledger:verify
      - if: failure()
        run: docker compose logs --no-color
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - if: always()
        run: docker compose down -v
