name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PLATFORMS: ${{ vars.RELEASE_PLATFORMS || 'linux/amd64' }}
  SCAN_APP_IMAGE: personal-finance:release-scan
  SCAN_BACKUP_IMAGE: personal-finance-backup:release-scan

jobs:
  release:
    name: Build and push immutable images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate the tag and derive image names
        id: names
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${tag}' is not a release tag like v1.2.3"
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "tag=${tag}"
            echo "app=ghcr.io/${owner}/personal-finance:${tag}"
            echo "backup=ghcr.io/${owner}/personal-finance-backup:${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Version pins
        run: scripts/check-pins.sh

      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing tag
        env:
          APP_IMAGE: ${{ steps.names.outputs.app }}
          BACKUP_IMAGE: ${{ steps.names.outputs.backup }}
        run: |
          for image in "$APP_IMAGE" "$BACKUP_IMAGE"; do
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "::error::${image} already exists; release tags are immutable, cut a new version"
              exit 1
            fi
          done

      - name: Build the app image for the secret scan
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: runtime
          load: true
          push: false
          tags: ${{ env.SCAN_APP_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the backup image for the secret scan
        uses: docker/build-push-action@v7.4.0
        with:
          context: docker/backup
          load: true
          push: false
          tags: ${{ env.SCAN_BACKUP_IMAGE }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max

      - name: No secrets in image layers, history or env
        run: scripts/check-image-secrets.sh "$SCAN_APP_IMAGE" "$SCAN_BACKUP_IMAGE"

      - name: Push the app image
        id: app
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: runtime
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.names.outputs.app }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.names.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Push the backup image
        id: backup
        uses: docker/build-push-action@v7.4.0
        with:
          context: docker/backup
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.names.outputs.backup }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.names.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=backup

      - name: Release summary
        env:
          TAG: ${{ steps.names.outputs.tag }}
          APP_IMAGE: ${{ steps.names.outputs.app }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          BACKUP_IMAGE: ${{ steps.names.outputs.backup }}
          BACKUP_DIGEST: ${{ steps.backup.outputs.digest }}
        run: |
          {
            echo "### Released ${TAG}"
            echo
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| \`${APP_IMAGE}\` | \`${APP_DIGEST}\` |"
            echo "| \`${BACKUP_IMAGE}\` | \`${BACKUP_DIGEST}\` |"
            echo
            echo "Deploy on the server: \`scripts/deploy.sh ${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
