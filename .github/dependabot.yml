version: 2

updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: monthly
    versioning-strategy: increase
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      laravel:
        patterns:
          - "laravel/*"
      dev-tooling:
        dependency-type: development

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    versioning-strategy: increase
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/*"
          - "angular-eslint"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@playwright/*"
          - "playwright"

  - package-ecosystem: docker
    directories:
      - /
      - /docker/backup
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
