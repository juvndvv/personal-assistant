x-dev-app: &dev-app
  image: personal-finance:dev
  build:
    context: .
    target: dev
    args:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
  environment:
    XDEBUG_MODE: ${XDEBUG_MODE:-off}
  volumes:
    - ./backend:/app
    - appstorage:/app/storage/app

x-after-migrate: &after-migrate
  db:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

x-no-healthcheck: &no-healthcheck
  disable: true

services:
  migrate:
    <<: *dev-app
    extends:
      file: compose.yaml
      service: worker
    command: ["php", "artisan", "migrate", "--no-interaction"]
    restart: "no"
    healthcheck: *no-healthcheck

  web:
    <<: *dev-app
    volumes:
      - ./backend:/app
      - appstorage:/app/storage/app
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      <<: *after-migrate
      frontend:
        condition: service_healthy

  worker:
    <<: *dev-app
    depends_on: *after-migrate
    healthcheck: *no-healthcheck

  scheduler:
    <<: *dev-app
    depends_on: *after-migrate
    healthcheck: *no-healthcheck

  frontend:
    image: node:24.21.0-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx ng serve --host 0.0.0.0 --port 4200"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_angular_cache:/app/.angular
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4200/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 300s

  db:
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro

volumes:
  frontend_node_modules:
  frontend_angular_cache:
