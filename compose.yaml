name: personal-finance

x-app: &app
  image: ${APP_IMAGE:-personal-finance:local}
  environment: &app-environment
    APP_KEY: ${APP_KEY:?Set APP_KEY in .env (make env)}
    APP_URL: ${APP_URL:-https://localhost}
    SERVER_NAME: ${SERVER_NAME:-localhost}
    LOG_CHANNEL: stderr
    LOG_STACK: stderr
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: "5432"
    DB_DATABASE: ${DB_DATABASE:-finance}
    DB_USERNAME: ${DB_USERNAME:-finance}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,127.0.0.1}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
    LOGIN_LOCKOUT_CACHE_STORE: ${LOGIN_LOCKOUT_CACHE_STORE:-database}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    AI_EXTRACTION_PROVIDER: ${AI_EXTRACTION_PROVIDER:-openai}
    AI_EXTRACTION_MODEL: ${AI_EXTRACTION_MODEL:-}
    AI_TRANSCRIPTION_PROVIDER: ${AI_TRANSCRIPTION_PROVIDER:-openai}
    AI_TRANSCRIPTION_MODEL: ${AI_TRANSCRIPTION_MODEL:-}
    AI_TIMEOUT: ${AI_TIMEOUT:-12}
    AI_FAILOVER: ${AI_FAILOVER:-}
    CAPTURE_DEADLINE_SECONDS: ${CAPTURE_DEADLINE_SECONDS:-15}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    OPENAI_COMPATIBLE_URL: ${OPENAI_COMPATIBLE_URL:-}
    OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
    OPENAI_COMPATIBLE_TEXT_MODEL: ${OPENAI_COMPATIBLE_TEXT_MODEL:-}
    OPENAI_COMPATIBLE_TRANSCRIPTION_MODEL: ${OPENAI_COMPATIBLE_TRANSCRIPTION_MODEL:-}
  volumes:
    - appstorage:/app/storage/app
  depends_on:
    db:
      condition: service_healthy

services:
  web:
    <<: *app
    environment:
      <<: *app-environment
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
      CADDY_SERVER_EXTRA_DIRECTIVES: ${CADDY_SERVER_EXTRA_DIRECTIVES:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - appstorage:/app/storage/app
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:2080/up"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3"]
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-finance}
      POSTGRES_USER: ${DB_USERNAME:-finance}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: Europe/Madrid
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  appstorage:
  caddy_data:
  caddy_config:
